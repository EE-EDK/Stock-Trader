{% extends "base.html" %}
{% block title %}Dashboard – Stock Trader{% endblock %}
{% block content %}
{% if has_report %}
<iframe src="/api/dashboard/latest" title="Dashboard report" style="width: 100%; height: calc(100vh - 120px); min-height: 500px; border: none; border-radius: 6px;"></iframe>
{% else %}
<div class="empty-state" style="padding: 3rem; text-align: center;">
    <p style="font-size: 1.2rem; color: var(--text-dim); margin-bottom: 1rem;">No report yet.</p>
    <p style="color: var(--text-dim);">Run the pipeline to generate the dashboard.</p>
    <a href="/run" style="display: inline-block; margin-top: 1rem; padding: 0.6rem 1.2rem; background: var(--accent); color: var(--bg-dark); border-radius: 6px; text-decoration: none;">Run Pipeline</a>
</div>
{% endif %}
{% endblock %}
