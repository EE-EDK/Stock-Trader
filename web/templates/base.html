<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Kunz Trader{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #1a1d23;
            --bg-medium: #252a33;
            --bg-light: #2d333b;
            --text: #e6edf3;
            --text-dim: #8b949e;
            --accent: #3fb950;
            --danger: #f85149;
            --border: #30363d;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg-dark); color: var(--text); min-height: 100vh; }
        .nav {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.75rem 1.5rem;
            background: var(--bg-medium);
            border-bottom: 1px solid var(--border);
        }
        .nav a {
            color: var(--text);
            text-decoration: none;
            padding: 0.5rem 0.75rem;
            border-radius: 6px;
        }
        .nav a:hover { background: var(--bg-light); color: var(--accent); }
        .nav a.active { background: var(--accent); color: var(--bg-dark); }
        .nav .spacer { flex: 1; min-width: 0; }
        .nav-brand-block {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            margin-right: 1rem;
            gap: 2px;
        }
        .brand-logo-text {
            font-family: 'Rajdhani', sans-serif;
            font-size: 22px;
            font-weight: 600;
            color: #ffffff;
            letter-spacing: 1.2px;
            text-transform: uppercase;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        .nav .coin-gif-wrap {
            width: 120px; height: 32px;
            display: flex; align-items: center; justify-content: center;
            overflow: hidden; border-radius: 4px;
        }
        .nav .coin-gif-wrap img {
            height: 100%; width: auto; max-width: 100%; object-fit: contain;
        }
        .nav .gear { font-size: 1.2rem; padding: 0.4rem 0.6rem; }
        main { padding: 1rem 1.5rem; max-width: 1400px; margin: 0 auto; }
        {% block extra_css %}{% endblock %}
    </style>
</head>
<body>
    <nav class="nav">
        <div class="nav-brand-block">
            <span class="brand-logo-text">Kunz Trader</span>
            <div class="coin-gif-wrap">
                <img src="/static/raining-coins.gif" alt="" title="Coins" />
            </div>
        </div>
        <a href="/" class="{% if request.url.path == '/' %}active{% endif %}">Dashboard</a>
        <a href="/run" class="{% if request.url.path == '/run' %}active{% endif %}">Run Pipeline</a>
        <a href="/config" class="{% if request.url.path == '/config' %}active{% endif %}">Settings</a>
        <span class="spacer"></span>
        <a href="/utilities" class="gear" title="Utilities">⚙</a>
    </nav>
    <main>
        {% block content %}{% endblock %}
    </main>
    {% block extra_js %}{% endblock %}
</body>
</html>
