{% extends "base.html" %}
{% block title %}Utilities – Stock Trader{% endblock %}
{% block content %}
<h1 style="margin-bottom: 1rem;">Utilities</h1>
<p style="color: var(--text-dim); margin-bottom: 1rem;">Development and validation tools.</p>
<div style="display: flex; flex-wrap: wrap; gap: 0.75rem; margin-bottom: 1rem;">
    <button data-util="type_check" style="padding: 0.5rem 1rem; background: var(--bg-light); color: var(--text); border: 1px solid var(--border); border-radius: 6px; cursor: pointer;">Type Check</button>
    <button data-util="verify_version" style="padding: 0.5rem 1rem; background: var(--bg-light); color: var(--text); border: 1px solid var(--border); border-radius: 6px; cursor: pointer;">Verify Bug Fixes</button>
    <button data-util="runtime" style="padding: 0.5rem 1rem; background: var(--bg-light); color: var(--text); border: 1px solid var(--border); border-radius: 6px; cursor: pointer;">Runtime Test</button>
</div>
<pre id="out" style="padding: 1rem; background: #0d1117; border: 1px solid var(--border); border-radius: 6px; min-height: 200px; overflow: auto; font-size: 0.85rem; white-space: pre-wrap;"></pre>
{% endblock %}
{% block extra_js %}
<script>
const out = document.getElementById('out');
const endpoints = { type_check: '/api/utility/type_check', verify_version: '/api/utility/verify_version', runtime: '/api/utility/runtime' };
document.querySelectorAll('[data-util]').forEach(btn => {
    btn.addEventListener('click', async () => {
        const util = btn.getAttribute('data-util');
        out.textContent = 'Running ' + util + '...\n\n';
        try {
            const r = await fetch(endpoints[util], { method: 'POST' });
            const data = await r.json();
            out.textContent += data.output || '';
            if (data.returncode !== 0) out.textContent += '\n[Exit ' + data.returncode + ']';
        } catch (e) {
            out.textContent += 'Error: ' + e.message;
        }
    });
});
</script>
{% endblock %}
