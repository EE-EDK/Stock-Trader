{% extends "base.html" %}
{% block title %}Backtest – Stock Trader{% endblock %}
{% block content %}
<h1 style="margin-bottom: 1rem;">Backtest</h1>
<p style="color: var(--text-dim); margin-bottom: 1rem;">Run backtest on historical signals. Uses config/config.yaml unless you specify a different config.</p>
<form id="backtestForm" style="margin-bottom: 1rem;">
    <label style="display: block; margin-bottom: 0.5rem;">Lookback days</label>
    <input type="number" name="days" value="90" min="1" max="730" style="padding: 0.4rem; background: var(--bg-light); color: var(--text); border: 1px solid var(--border); border-radius: 4px; width: 100px;">
    <label style="display: block; margin: 0.75rem 0 0.5rem;">Config file (optional)</label>
    <input type="text" name="config_file" placeholder="config/config.yaml" style="padding: 0.4rem; background: var(--bg-light); color: var(--text); border: 1px solid var(--border); border-radius: 4px; width: 280px;">
    <div style="margin-top: 0.75rem;">
        <button type="submit" style="padding: 0.6rem 1.2rem; background: var(--accent); color: var(--bg-dark); border: none; border-radius: 6px; font-weight: 600; cursor: pointer;">Run Backtest</button>
    </div>
</form>
<pre id="out" style="padding: 1rem; background: #0d1117; border: 1px solid var(--border); border-radius: 6px; min-height: 250px; overflow: auto; font-size: 0.85rem; white-space: pre-wrap;"></pre>
{% endblock %}
{% block extra_js %}
<script>
document.getElementById('backtestForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const form = e.target;
    const out = document.getElementById('out');
    out.textContent = 'Running backtest...\n\n';
    const fd = new FormData(form);
    try {
        const r = await fetch('/api/backtest', { method: 'POST', body: fd });
        const data = await r.json();
        out.textContent += data.output || '';
        if (!data.ok) out.textContent += '\n[Exit ' + data.returncode + ']';
    } catch (e) {
        out.textContent += 'Error: ' + e.message;
    }
});
</script>
{% endblock %}
